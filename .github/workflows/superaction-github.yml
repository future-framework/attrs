# python-attrs/attrs's ci.yml: tests (python-version 3.14), for the Superaction scoreboard.
name: Superaction (GitHub)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0
      # Upstream builds the sdist and wheel in a separate build-package job
      # (hynek/build-and-inspect-python-package) and downloads them here.
      - name: Build packages
        run: uv build --out-dir dist
      - run: tar xf dist/*.tar.gz --strip-components=1
      - name: Remove src to ensure tests run against wheel
        run: rm -rf src
      - run: >
          uv run --only-group tox
          tox run
          --installpkg dist/*.whl
          -e $PYTHON-tests
